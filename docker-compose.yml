services:
  backend:
    build:
      context: ./backend
    container_name: windsight-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - FORECAST_CUTOFF_UTC_HOUR=12
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: windsight-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:4173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4173"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
